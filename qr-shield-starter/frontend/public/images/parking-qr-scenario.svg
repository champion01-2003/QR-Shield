<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative parking QR sticker safety scenario</title>
  <desc id="desc">A city parking sign, payment QR code, and a warning to inspect for a sticker overlay.</desc>
  <defs>
    <linearGradient id="scene" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102b3b"/>
      <stop offset="1" stop-color="#172236"/>
    </linearGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#050a12" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="720" height="390" rx="28" fill="url(#scene)"/>
  <circle cx="590" cy="80" r="120" fill="#39d7c0" opacity=".07"/>
  <path d="M0 315c120-46 213-31 320 6s198 11 400-36v105H0Z" fill="#071321" opacity=".65"/>
  <g transform="translate(100 42)" filter="url(#lift)">
    <rect x="38" y="18" width="22" height="285" rx="10" fill="#8ca4b5"/>
    <rect x="0" y="0" width="316" height="225" rx="16" fill="#e5eef0" stroke="#a7c1c7" stroke-width="5"/>
    <rect x="17" y="16" width="282" height="44" rx="8" fill="#12424a"/>
    <text x="33" y="45" fill="#e7fffa" font-family="Arial,sans-serif" font-size="19" font-weight="700">CITY PARKING</text>
    <text x="27" y="88" fill="#1b3444" font-family="Arial,sans-serif" font-size="14" font-weight="700">ZONE 402 · PAY TO PARK</text>
    <text x="27" y="110" fill="#536778" font-family="Arial,sans-serif" font-size="11">Use the official payment service</text>
    <rect x="196" y="77" width="92" height="92" rx="7" fill="#fff" stroke="#bdcbd1"/>
    <g fill="#12353c">
      <path d="M205 86h24v24h-24zm5 5v14h14V91zm2 2h10v10h-10zm44-7h24v24h-24zm5 5v14h14V91zm2 2h10v10h-10zm-58 35h24v24h-24zm5 5v14h14v-14zm2 2h10v10h-10z"/>
      <path d="M241 116h8v8h-8zm13 0h8v8h-8zm13 0h8v8h-8zm-19 13h8v8h-8zm13 0h8v8h-8zm13 0h8v8h-8zm-20 13h8v8h-8zm13 0h8v8h-8z"/>
    </g>
    <path d="m189 73 109 0-6 103-99-5z" fill="none" stroke="#fb7185" stroke-dasharray="7 5" stroke-width="3"/>
    <path d="M267 69 300 40" stroke="#fb7185" stroke-width="3" stroke-linecap="round"/>
    <rect x="263" y="15" width="88" height="28" rx="12" fill="#581c35"/>
    <text x="275" y="34" fill="#fecdd3" font-family="Arial,sans-serif" font-size="11" font-weight="700">CHECK EDGE</text>
    <rect x="26" y="183" width="264" height="26" rx="8" fill="#d4e6e6"/>
    <text x="39" y="201" fill="#315663" font-family="Arial,sans-serif" font-size="11">Training illustration · not a real location</text>
  </g>
  <g transform="translate(462 112)">
    <rect width="206" height="164" rx="20" fill="#111f30" stroke="#355369" stroke-width="2"/>
    <circle cx="36" cy="34" r="16" fill="#47212f"/>
    <path d="M36 24v12m0 8v1" stroke="#ff92a0" stroke-linecap="round" stroke-width="3"/>
    <text x="62" y="31" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="14" font-weight="700">Before you pay</text>
    <text x="21" y="74" fill="#a8bac9" font-family="Arial,sans-serif" font-size="12">1. Check for a second sticker</text>
    <text x="21" y="98" fill="#a8bac9" font-family="Arial,sans-serif" font-size="12">2. Preview the hostname</text>
    <text x="21" y="122" fill="#a8bac9" font-family="Arial,sans-serif" font-size="12">3. Verify with the city</text>
    <rect x="19" y="137" width="168" height="3" rx="2" fill="#36d4bd" opacity=".7"/>
  </g>
  <text x="462" y="314" fill="#80a0b2" font-family="Arial,sans-serif" font-size="11">Illustrative scenario, based on public safety guidance</text>
</svg>
