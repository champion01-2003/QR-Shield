    <rect x="47" y="107" width="188" height="188" rx="14" fill="#f2fbfa"/>
    <g fill="#143b42">
      <path d="M62 122h54v54H62zm10 10v34h34v-34zm5 5h24v24H77zm63-15h54v54h-54zm10 10v34h34v-34zm5 5h24v24h-24zM62 202h54v54H62zm10 10v34h34v-34zm5 5h24v24H77z"/>
      <path d="M129 184h17v17h-17zm25 0h17v17h-17zm25 0h17v17h-17zm-42 25h17v17h-17zm25 0h17v17h-17zm25 0h17v17h-17zm-33 25h17v17h-17zm25 0h17v17h-17zm25 0h17v17h-17zm-50 25h17v17h-17zm25 0h17v17h-17zm25 0h17v17h-17z"/>
    </g>
