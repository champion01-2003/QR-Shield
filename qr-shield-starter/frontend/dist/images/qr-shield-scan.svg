<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">QR Shield safe scanning illustration</title>
  <desc id="desc">A phone scans a QR code and displays a destination review card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09283a"/>
      <stop offset="1" stop-color="#10162a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20d8c1"/>
      <stop offset="1" stop-color="#37a9ff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="1000" height="560" rx="32" fill="url(#bg)"/>
  <circle cx="820" cy="120" r="175" fill="#27d7c3" opacity=".08"/>
